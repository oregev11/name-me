[project]
name = "nameme"
version = "0.1.0"
description = "Backend API for the Hebrew baby-name recommender"
readme = "README.md"
authors = [
    { name = "OR", email = "oregev11@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "scikit-learn>=1.5",
    "numpy>=2.0",
    "pandas>=2.2",
    "joblib>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()-in-default-argument is the framework's idiomatic
# dependency-injection pattern, not the mutable-default footgun this rule
# targets.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
